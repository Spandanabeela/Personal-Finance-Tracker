<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
        <title>Personal Finance Tracker</title>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <div class="container">
            <h1>Personal Finance Tracker</h1>

            <div class="summary">
                <div class="card">
                    <h3>Total Balance</h3>
                    <p id="balance">₹0</p>
                </div>

                <div class="card">
                    <h3>Total Income</h3>
                    <p id="income">₹0</p>
                </div>

                <div class="card">
                    <h3>Total Income</h3>
                    <p id="expense">₹0</p>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
